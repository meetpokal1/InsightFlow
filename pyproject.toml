[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# FastAPI uses Depends(...) in argument defaults; line length is managed by ruff format
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a running PostgreSQL (skipped when the database is unreachable)"]
filterwarnings = [
    # raised inside Starlette's own test client, nothing to fix in this project
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
