services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sales_intelligence
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_demo_password}
    ports:
      - "5432:5432"
    volumes:
      - insightflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed-demo:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sales_intelligence
      DB_USER: sales_user
      DB_PASSWORD: ${DB_PASSWORD:-local_demo_password}
      AS_OF_DATE: "2026-09-30"
    command: ["python", "scripts/run_pipeline.py", "--reset-schema", "--as-of", "2026-09-30"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sales_intelligence
      DB_USER: sales_user
      DB_PASSWORD: ${DB_PASSWORD:-local_demo_password}
      AS_OF_DATE: "2026-09-30"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      seed-demo:
        condition: service_completed_successfully

volumes:
  insightflow_pgdata:
